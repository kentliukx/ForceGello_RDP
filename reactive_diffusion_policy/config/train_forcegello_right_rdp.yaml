defaults:
  - train_latent_diffusion_unet_real_image_workspace
  - override task: real_forcegello_right_wrench_ldp_20fps
  - override at: at_forcegello_right
  - _self_

obs_temporal_downsample_ratio: 4
task:
  dataset:
    sample_phase: 0  # One 20 Hz stream per 60 Hz recording.
policy:
  at:
    device: ${training.device}

training:
  checkpoint_every: 20
  log_both_validation_losses: true

checkpoint:
  deploy_only_topk: true
  topk:
    monitor_key: val_loss
    k: ${training.num_epochs}
    format_str: 'epoch={epoch:04d}-val_loss={val_loss:.6f}-deploy.ckpt'

logging:
  mode: offline
