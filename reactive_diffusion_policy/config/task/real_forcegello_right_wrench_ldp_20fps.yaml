defaults:
  - real_forcegello_right_wrench_at_20fps@_here_
  - _self_

name: real_forcegello_right_wrench_ldp_20fps

shape_meta:
  obs:
    external_img:
      shape: ${task.image_shape}
      type: rgb
      n_obs_steps: 2
      temporal_downsample_ratio: 4
      hold_steps: 4
    right_wrist_img:
      shape: ${task.image_shape}
      type: rgb
      n_obs_steps: 2
      temporal_downsample_ratio: 4
      hold_steps: 4
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
    right_robot_tcp_pose:
      shape: [9]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
  extended_obs:
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
    right_robot_tcp_pose:
      shape: [9]
      type: low_dim
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    key: right_robot_tcp_delta
    space: tcp_delta
    shape: [7]

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_latent_diffusion_dataset.RealImageTactileLatentDiffusionDataset
  shape_meta: ${task.shape_meta}
  slow_obs_latency_steps: 1  # t observation; latent first drives the t+1 fast decoder and t+2 command.
  use_latent_action_before_vq: ${use_latent_action_before_vq}
  at: ${policy.at}
