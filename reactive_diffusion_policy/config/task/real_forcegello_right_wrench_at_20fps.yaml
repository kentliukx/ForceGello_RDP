name: real_forcegello_right_wrench_at_20fps
dataset_path: ../i2rt/data/forcegello_zarr
image_shape: [3, 240, 320]
control_hz: 20.0
visual_hz: 5.0
proprio_hz: 20.0
inference_hz: 5.0

shape_meta:
  obs:
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
    right_robot_joint_effort_external:
      shape: [6]
      type: low_dim
      n_obs_steps: 2
      temporal_downsample_ratio: 1
  extended_obs:
    right_robot_joint_effort_external:
      shape: [6]
      type: low_dim
  action:
    key: right_robot_command
    space: joint
    shape: [7]

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_dataset.RealImageTactileDataset
  shape_meta: ${task.shape_meta}
  dataset_path: ${task.dataset_path}
  sample_hz: ${task.control_hz}
  horizon: ${horizon}
  pad_before: ${eval:'${dataset_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  n_obs_steps: ${dataset_obs_steps}
  slow_obs_latency_steps: 1  # Slow joint anchor is one fast tick before the first decoded action.
  relative_joint_anchor: slow_observation
  absolute_gripper_action: True
  obs_temporal_downsample_ratio: ${dataset_obs_temporal_downsample_ratio}
  n_latency_steps: ${n_latency_steps}
  seed: 42
  val_ratio: 0.1
  max_train_episodes: null
  delta_action: False
  relative_action: True  # Arm joints use the fixed slow-observation anchor; gripper stays absolute.
