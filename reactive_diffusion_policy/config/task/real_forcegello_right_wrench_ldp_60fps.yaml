defaults:
  - real_forcegello_right_wrench_at_60fps@_here_
  - _self_

name: real_forcegello_right_wrench_ldp_60fps

shape_meta:
  obs:
    external_img:
      shape: ${task.image_shape}
      type: rgb
    right_wrist_img:
      shape: ${task.image_shape}
      type: rgb
    right_robot_joint_pos:
      shape: [7]
      type: low_dim
    right_robot_joint_vel:
      shape: [7]
      type: low_dim
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  extended_obs:
    right_robot_tcp_wrench:
      shape: [6]
      type: low_dim
  action:
    key: right_robot_action
    space: joint
    shape: [14]

dataset:
  _target_: reactive_diffusion_policy.dataset.real_image_tactile_latent_diffusion_dataset.RealImageTactileLatentDiffusionDataset
  shape_meta: ${task.shape_meta}
  use_latent_action_before_vq: ${use_latent_action_before_vq}
  at: ${policy.at}
